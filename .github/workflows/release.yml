---
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and upload release asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # HACS extracts the release asset directly into custom_components/ariston,
      # so the files must be at the ROOT of the zip (no enclosing "ariston/").
      - name: Build HACS-compatible zip
        run: |
          git archive \
            --format=zip \
            --output="$GITHUB_WORKSPACE/ariston-remotethermo-home-assistant-v3.zip" \
            "${{ github.event.release.tag_name }}:custom_components/ariston"

      - name: Verify HACS-compatible layout
        run: |
          unzip -Z1 ariston-remotethermo-home-assistant-v3.zip > /tmp/zip-contents.txt
          grep -qx 'manifest.json' /tmp/zip-contents.txt
          grep -qx '__init__.py' /tmp/zip-contents.txt
          if grep -q '^ariston/' /tmp/zip-contents.txt; then
            echo "ERROR: the zip contains an enclosing ariston/ folder" >&2
            exit 1
          fi
          cat /tmp/zip-contents.txt

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ariston-remotethermo-home-assistant-v3.zip
